[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oarepo-invenio-typing-stubs"
version = "0.1.32"
description = "OAREPO typing package for invenio packages. Stub files only."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "celery-types"
]

[project.optional-dependencies]
tests = [
    "flask",
    "opensearch-dsl",
    "marshmallow",
    "marshmallow-oneofschema",
    "mypy",
    "pyright",
    "pytest>=8.4.2",
    "sqlalchemy",
    "types-lxml>=2025.8.25",
]
dev = [
    "invenio-app-rdm[opensearch2,postgresql]>=14.0.0dev0",
    "invenio-s3",
    "mypy",
    "pyright",
    "types-lxml>=2025.8.25",
    "absolufy-imports",
]

[dependency-groups]
dev = [
    "invenio-app-rdm[opensearch2,postgresql]>=14.0.0dev0",
    "invenio-s3",
    "mypy",
    "pyright",
    "types-lxml>=2025.8.25",
    "absolufy-imports",
]

[tool.hatch.build.targets.wheel]
packages = [
    "datacite-stubs",
    "flask_login-stubs",
    "flask_principal-stubs",
    "flask_resources-stubs",
    "flask_security-stubs",
    "invenio_access-stubs",
    "invenio_accounts-stubs",
    "invenio_app-stubs",
    "invenio_assets-stubs",
    "invenio_audit_logs-stubs",
    "invenio_communities-stubs",
    "invenio_db-stubs",
    "invenio_drafts_resources-stubs",
    "invenio_files_rest-stubs",
    "invenio_i18n-stubs",
    "invenio_indexer-stubs",
    "invenio_jobs-stubs",
    "invenio_jsonschemas-stubs",
    "invenio_pidstore-stubs",
    "invenio_rdm_records-stubs",
    "invenio_records_permissions-stubs",
    "invenio_records_resources-stubs",
    "invenio_records-stubs",
    "invenio_requests-stubs",
    "invenio_search-stubs",
    "invenio_stats-stubs",
    "invenio_vocabularies-stubs",
]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = [
    "D401",
    "D403",
]

# [tool.pytest.ini_options]
# addopts = "--black --isort --cov=invenio_typing_s --cov-report=term-missing"
# testpaths = "tests invenio_catalogue_marc21"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "E501",
  "FA100", "FA102",
  "FIX002",
  "INP001",
  "N999",
  "PERF203",
  "PLR0913",
  "RET504",
  "RUF012",
  "S101",
  "SLF001",
  "TC",
  "TD",
  "TID252",
  "UP009",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "ANN201",
  "S108", "S311",
]

[tool.mypy]
extra_checks = true
strict = true
strict_bytes = true
strict_equality = true
follow_untyped_imports = true
disallow_any_generics = false
python_executable = ".venv/bin/python"
